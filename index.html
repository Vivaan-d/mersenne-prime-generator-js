<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>mersenne prime generator.html</title>
    <style>
        div{
            width:50%;
            position:absolute;
            bottom:0;
            height:50%;
            overflow-y:scroll;
        }
        .primes{
            left:0;
            background-color:rgb(190, 255, 190);
        }
        .composites{
            right:0;
            background-color: rgb(255, 190, 190);
        }
    </style>
</head>
<body>
    <h1>hi</h1>
    <p>this generator gives you prime numbers<br>
    Mersenne prime numbers</p>
    <div class="primes">prime numbers - 3</div><div class="composites">composite numbers - </div>
    <script>var prime = (n) => {
    if ((n - 1n) % 6n === 0n) {
        for (var i = 2n; i < BigInt(Math.sqrt(Number(n))); i++) {
            if (n % i === 0n) {
                return false;
            }
        }
    } else if ((n + 1n) % 6n === 0n) {
        for (var i = 2n; i < BigInt(Math.sqrt(Number(n))); i++) {
            if (n % i === 0n) {
                return false;
            }
        }
    } else {
        return false;
    }
    return true;
};

generate = async () => {
    for (var x = 1n; true; x++) {
        const n = (2n ** x) - 1n;

        if (prime(n)) {
            document.querySelector(".primes").innerHTML += ", " + n;
        } else {
            document.querySelector(".composites").innerHTML += n + ", ";
        }

        await new Promise((resolve) => setTimeout(resolve, 50));
    }
};

generate();

    </script>
</body>
</html>
