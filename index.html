<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>mersenne prime generator.html</title>
    <style>
        div{
            width:50%;
            position:absolute;
            bottom:0;
            height:50%;
            overflow-y:scroll;
        }
        .primes{
            left:0;
            background-color:rgb(190, 255, 190);
        }
        .composites{
            right:0;
            background-color: rgb(255, 190, 190);
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/11.5.0/math.min.js"></script>
</head>
<body>
    <h1>hi</h1>
    <p>this generator gives you prime numbers<br>
    Mersenne prime numbers</p>
    <div class="primes">prime numbers - 3</div><div class="composites">composite numbers - </div>
    <script>
        
        var prime = (n) => {
            // Convert n to a BigNumber
            n = math.bignumber(n);
        
            // Check 6n ± 1 rule using Math.js for arbitrary precision
            if (math.mod(math.subtract(n, 1), 6).equals(0) || math.mod(math.add(n, 1), 6).equals(0)) {
                // Get the square root of n as a BigNumber
                const limit = math.sqrt(n);
        
                for (let i = math.bignumber(2); math.largerEq(i, limit) === false; i = math.add(i, 1)) {
                    if (math.mod(n, i).equals(0)) {
                        return false; // Not prime if divisible
                    }
                }
                return true; // Prime if no divisors are found
            }
        
            return false; // Doesn't satisfy 6n ± 1 rule
        };
        
        generate = async () => {
            for (var x = 1; true; x++) {
                // Calculate 2^x - 1 as a BigNumber
                const n = math.subtract(math.pow(2, x), 1);
        
                console.log(`Testing ${n}`); // Debugging output
        
                if (prime(n)) {
                    console.log(`${n} is prime`);
                    document.querySelector(".primes").innerHTML += ", " + n;
                } else {
                    console.log(`${n} is composite`);
                    document.querySelector(".composites").innerHTML += n + ", ";
                }
        
                await new Promise((resolve) => setTimeout(resolve, 50)); // Add delay to prevent freezing
            }
        };
        
        generate();        
    </script>
</body>
</html>
