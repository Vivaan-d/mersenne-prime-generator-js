<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>mersenne prime generator.html</title>
    <style>
        div{
            width:50%;
            position:absolute;
            bottom:0;
            height:50%;
            overflow-y:scroll;
        }
        .primes{
            left:0;
            background-color:rgb(190, 255, 190);
        }
        .composites{
            right:0;
            background-color: rgb(255, 190, 190);
        }
    </style>
</head>
<body>
    <h1>hi</h1>
    <p>this generator gives you prime numbers<br>
    Mersenne prime numbers</p>
    <div class="primes">prime numbers - 3</div><div class="composites">composite numbers - </div>
    <script>var prime = (n) => {
        if (n <= 1n) return false; // 1 is not prime
        if (n === 2n || n === 3n) return true; // 2 and 3 are prime
        if (n % 2n === 0n || n % 3n === 0n) return false; // Exclude multiples of 2 and 3
    
        // Check divisibility using the 6n ± 1 rule
        if ((n - 1n) % 6n === 0n || (n + 1n) % 6n === 0n) {
            for (let i = 2n; i <= sqrtBigInt(n); i++) {
                if (n % i === 0n) {
                    return false; // Not prime if divisible
                }
            }
            return true; // Prime if no divisors are found
        }
    
        return false; // Doesn't satisfy 6n ± 1 rule
    };
    const sqrtBigInt = (value) => {
    let x = value;
    let y = (x + 1n) / 2n;
    while (y < x) {
        x = y;
        y = (x + value / x) / 2n;
    }
    return x;
};

    
    generate = async () => {
        for (var x = 1n; x <= 25n; x++) { // Increase loop range as needed
            const n = (2n ** x) - 1n; // Generate Mersenne number
    
            if (prime(n)) {
                document.querySelector(".primes").innerHTML += ", " + n;
            } else {
                document.querySelector(".composites").innerHTML += n + ", ";
            }
    
            await new Promise((resolve) => setTimeout(resolve, 50)); // Add delay to prevent freezing
        }
    };
    
    generate();
    
    </script>
</body>
</html>
