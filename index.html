<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>mersenne prime generator.html</title>
    <style>
        div{
            width:50%;
            position:absolute;
            bottom:0;
            height:50%;
            overflow-y:scroll;
        }
        .primes{
            left:0;
            background-color:rgb(190, 255, 190);
        }
        .composites{
            right:0;
            background-color: rgb(255, 190, 190);
        }
    </style>
</head>
<body>
    <h1>hi</h1>
    <p>this generator gives you prime numbers<br>
    Mersenne prime numbers</p>
    <div class="primes">prime numbers - 3</div><div class="composites">composite numbers - </div>
    <script>var prime = (n) => {
        if (n <= 1) return false; // 1 is not prime
        if (n === 2 || n === 3) return true; // 2 and 3 are prime
        if (n % 2 === 0 || n % 3 === 0) return false; // Exclude multiples of 2 and 3
    
        // Check divisibility using the 6n ± 1 rule
        if (Number.isInteger((n - 1) / 6) || Number.isInteger((n + 1) / 6)) {
            const limit = Math.floor(Math.sqrt(n)); // Calculate square root as an integer
            for (let i = 2; i <= limit; i++) {
                if (n % i === 0) {
                    return false; // Not prime if divisible
                }
            }
            return true; // Prime if no divisors are found
        }
    
        return false; // Doesn't satisfy 6n ± 1 rule
    };
    
    generate = async () => {
        for (var x = 1; x <= 53; x++) { // Limit iterations to Number.MAX_SAFE_INTEGER
            const n = Math.pow(2, x) - 1; // Generate Mersenne number
    
            if (n > Number.MAX_SAFE_INTEGER) {
                console.log(`Skipping ${n} as it exceeds Number.MAX_SAFE_INTEGER`);
                break; // Stop if the number is too large
            }
    
            console.log(`Testing ${n}`); // Debugging output
    
            if (prime(n)) {
                console.log(`${n} is prime`);
                document.querySelector(".primes").innerHTML += ", " + n;
            } else {
                console.log(`${n} is composite`);
                document.querySelector(".composites").innerHTML += n + ", ";
            }
    
            await new Promise((resolve) => setTimeout(resolve, 50)); // Add delay
        }
    };
    
    generate();
    </script>
</body>
</html>
